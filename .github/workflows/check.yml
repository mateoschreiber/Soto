name: Rust y Docker
on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['docs/**', 'README.md']
  pull_request:

permissions:
  contents: read

concurrency:
  group: soto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain fijada
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked -p soto-core -p soto-server --all-targets -- -D warnings
      - run: cargo clippy --locked -p soto-web --target wasm32-unknown-unknown -- -D warnings
      - name: Auditoría de dependencias
        run: |
          curl -fsSL https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz -o /tmp/audit.tgz
          tar xzf /tmp/audit.tgz -C /tmp
          /tmp/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit audit
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Construir y arrancar en Docker
        run: |
          docker compose config --quiet
          docker compose build
          docker compose up -d --wait --wait-timeout 120
      - name: Comprobar runtime limitado
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/health
          curl --fail --silent http://127.0.0.1:3000/ -o /tmp/soto-index.html
          grep -q 'Soto' /tmp/soto-index.html
          docker compose exec -T web /app/soto-server --healthcheck
          test "$(docker compose exec -T web id -u)" = 10001
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$(docker compose ps -q web)")" = true
          docker image inspect soto:0.1.0 --format 'Imagen: {{.Size}} bytes'
          docker stats --no-stream
      - name: Diagnóstico
        if: always()
        run: docker compose logs --tail=80
      - name: Detener servicios
        if: always()
        run: docker compose down
