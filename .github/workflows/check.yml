name: Rust y Docker
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']

permissions:
  contents: read

concurrency:
  group: soto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Toolchain fijada
        run: rustup show
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked -p soto-core -p soto-server --all-targets -- -D warnings
      - run: cargo clippy --locked -p soto-web --target wasm32-unknown-unknown -- -D warnings
      - name: Auditoría de dependencias
        run: |
          curl -fsSL https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz -o /tmp/audit.tgz
          tar xzf /tmp/audit.tgz -C /tmp
          /tmp/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit audit
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Construir API y worker separados
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
          docker compose -f compose.yaml -f compose.build.yaml build
      - name: Prueba funcional con medios generados y volúmenes limpios
        run: python3 scripts/docker-smoke.py --image soto:local --worker-image soto:worker-local
