[workspace]
members = ["crates/soto-core", "crates/soto-web", "crates/soto-server"]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.99"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
panic = "abort"
# wasm-bindgen/wasm-opt remove symbols after bundling. Avoid dx's host-specific objcopy path.
strip = false
