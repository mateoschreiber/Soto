name: soto
services:
  web:
    build: .
    image: soto:0.1.0
    ports:
      - "127.0.0.1:${SOTO_PORT:-3000}:3000"
    environment:
      SOTO_BIND: "0.0.0.0:3000"
      SOTO_STATIC_DIR: "/app/public"
      RUST_LOG: "soto_server=info,tower_http=warn"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
