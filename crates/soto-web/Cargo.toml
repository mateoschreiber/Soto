[package]
name = "soto-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
soto-core = { path = "../soto-core" }
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "asset", "cli-config", "web"] }
gloo-events = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Storage", "Element", "HtmlElement", "HtmlInputElement", "HtmlDialogElement", "KeyboardEvent", "DomRect", "NodeList", "History", "MediaQueryList", "RequestCredentials", "HtmlMediaElement", "HtmlVideoElement", "Event", "EventTarget", "MediaSource", "SourceBuffer", "Url", "TimeRanges"] }
wasm-bindgen = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
futures-channel = "0.3"
futures-util = "0.3"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
dioxus-ssr = "=0.7.10"



